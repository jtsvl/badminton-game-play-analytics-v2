<style>
  html, body { margin: 0; padding: 0; }
  .bca-press { transition: transform .18s ease, box-shadow .18s ease; }
  .bca-press:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg) !important; }
  .bca-press:active { transform: translateY(0) scale(.985); }
  .bca-row-flat { transition: background .15s ease; }
  .bca-row-flat:hover { background: rgba(10,10,11,.035); }
  .bca-ghost { transition: transform .15s ease, background .15s ease; }
  .bca-ghost:hover { background: rgba(10,10,11,.06); }
  .bca-ghost:active { transform: scale(.92); }
  .bca-tab { -webkit-tap-highlight-color: transparent; }
  .bca-range { height: 22px; cursor: pointer; }
  .dk-navlink { color: #0A0A0B; transition: color .15s ease; }
  .dk-navlink:hover { color: #FA8832; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Sanitize a stale design-canvas viewport: if the saved pan/zoom would leave
  // the (now single) artboard off-screen or as a tiny island — e.g. it was saved
  // when this canvas held 5 artboards — reset to a sensible centered view before
  // the canvas reads it. Runs every load; only fires on clearly-broken values, so
  // normal pans are preserved.
  (function () {
    try {
      var k = 'dc-viewport:' + location.pathname;
      var s = JSON.parse(localStorage.getItem(k) || 'null');
      var broken = !s || !Number.isFinite(s.scale) || s.scale < 0.18 ||
        s.y < -400 || s.y > 1600 || s.x < -1000 || s.x > 2600;
      if (broken) localStorage.setItem(k, JSON.stringify({ x: 120, y: 48, scale: 0.52 }));
    } catch (e) { /* noop */ }
  })();
</script>
