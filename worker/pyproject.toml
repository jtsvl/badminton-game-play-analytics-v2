[project]
name = "badminton-worker"
version = "0.1.0"
description = "Local CV/ML worker: processes uploaded badminton clips into insights (Apple Silicon, PyTorch MPS)."
requires-python = ">=3.11"
dependencies = [
  "supabase>=2.7",        # storage download + REST writes
  "psycopg[binary]>=3.2", # job claim via FOR UPDATE SKIP LOCKED
  "python-dotenv>=1.0",
]

# Heavy CV/ML stack kept in an extra so the core worker + insights install light.
# Installed on the Mac Studio for real processing (PyTorch MPS). See specs/30-ml-pipeline.md.
[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "av>=12.3",            # PyAV (ffmpeg/VideoToolbox decode)
  "ultralytics>=8.3",   # YOLO11 (AGPL — non-distributed use, see CLAUDE.md)
  "lap>=0.5.12",        # linear assignment for BoT-SORT/ByteTrack (ultralytics tracker dependency)
  "polars>=1.0",        # Parquet intermediates (detections/tracks); pulled transitively by ultralytics
  "pillow>=10.0",       # JPEG frame cache + calibration still (PyAV frame.to_image)
  "rtmlib>=0.0.13",     # RTMPose top-down inference w/o mmcv (Apache); pose stage 4
  "onnxruntime>=1.18",  # RTMPose backend; device='mps' -> CoreML EP on Apple Silicon (CLAUDE.md)
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
