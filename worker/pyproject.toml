[project]
name = "badminton-worker"
version = "0.1.0"
description = "Local CV/ML worker: processes uploaded badminton clips into insights (Apple Silicon, PyTorch MPS)."
requires-python = ">=3.11"
dependencies = [
  "supabase>=2.7",        # storage download + REST writes
  "psycopg[binary]>=3.2", # job claim via FOR UPDATE SKIP LOCKED
  "python-dotenv>=1.0",
]

# Heavy CV/ML stack kept in an extra so the core worker + insights install light.
# Installed on the Mac Studio for real processing (PyTorch MPS). See specs/30-ml-pipeline.md.
[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "av>=12.3",            # PyAV (ffmpeg/VideoToolbox decode)
  "ultralytics>=8.3",   # YOLO11 (AGPL — non-distributed use, see CLAUDE.md)
  "lap>=0.5.12",        # linear assignment for BoT-SORT/ByteTrack (ultralytics tracker dependency)
  "polars>=1.0",        # Parquet intermediates (detections/tracks); pulled transitively by ultralytics
  "pillow>=10.0",       # JPEG frame cache + calibration still (PyAV frame.to_image)
  "rtmlib>=0.0.13",     # RTMPose top-down inference w/o mmcv (Apache); pose stage 4
  "onnxruntime>=1.18",  # RTMPose backend; device='mps' -> CoreML EP on Apple Silicon (CLAUDE.md)
  "pandas>=3.0.3",      # TrackNetV3 backend dep (shuttle stage 5); its dataset/utils import it
  "parse>=1.22.1",      # TrackNetV3 backend dep (shuttle stage 5)
  "omegaconf>=2.3",     # WASB backend dep (shuttle stage 5); HRNet config (mixed dict/attr access)
  "tensorboard>=2.20.0", # TrackNetV3 fine-tune training logs (local MPS run, worker/training/)
  "pycocotools>=2.0.11", # TrackNetV3 fine-tune dep (training/eval)
  "positional-encodings>=6.0", # BST vendored model dep (stroke stage 7, worker/training/)
  "torchinfo>=1.8",     # BST vendored model dep (stroke stage 7); imported at bst.py module top
]
# VideoJev-4B zero-shot stroke pilot (specs/features/stroke-vlm-pilot.md). Separate extra so the
# core `ml` env is untouched; pins follow upstream requirements-overlay.txt (MCG-NJU/VideoJev).
# Deliberately absent: flash-linear-attention / flash-attn / causal-conv1d / deepspeed — CUDA-only;
# transformers' Qwen3.5 layers fall back to pure-torch kernels without them (MPS/CPU path).
# `av` stays on the ml extra's locked version: the remote code only uses av.open/decode.
vlm = [
  "transformers==5.14.1", # exact: the HF snapshot's remote code imports transformers.models.qwen3_5
  "accelerate>=1.10",
  "einops>=0.8",
  "scipy>=1.12",
  "safetensors>=0.4",
  "huggingface_hub>=0.30", # `hf download` for the pinned revision
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
